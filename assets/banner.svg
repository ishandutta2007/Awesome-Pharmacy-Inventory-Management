<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Embedded Dynamic Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-2deg); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.4; }
        100% { transform: translateY(300px); opacity: 0.1; }
      }
      @keyframes shimmerBorder {
        0% { stroke: #06b6d4; }
        33% { stroke: #818cf8; }
        66% { stroke: #10b981; }
        100% { stroke: #06b6d4; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .pulse-item {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .float-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .float-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .shimmer-card {
        animation: shimmerBorder 8s linear infinite;
      }
      .dashed-flow {
        stroke-dasharray: 6 4;
        animation: dashAnim 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="250" y1="0" x2="250" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="550" y1="0" x2="550" y2="340"/>
    <line x1="700" y1="0" x2="700" y2="340"/>
    <line x1="850" y1="0" x2="850" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
    <line x1="1150" y1="0" x2="1150" y2="340"/>
    
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" class="pulse-item"/>
  <circle cx="1050" cy="180" r="160" fill="#059669" opacity="0.15" filter="url(#glow)" class="pulse-item"/>
  <circle cx="600" cy="280" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Futuristic Healthcare / Pharmacy Symbol -->
  <g class="float-1" transform="translate(60, 85)">
    <!-- Circuit Card Outer -->
    <rect x="0" y="0" width="130" height="150" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" class="shimmer-card"/>
    <!-- Medical Cross with Glow -->
    <g filter="url(#softGlow)">
      <path d="M 50 40 L 80 40 L 80 65 L 105 65 L 105 95 L 80 95 L 80 120 L 50 120 L 50 95 L 25 95 L 25 65 L 50 65 Z" fill="url(#cyanEmerald)" opacity="0.9"/>
    </g>
    <!-- Inventory Stock Indicator Lines -->
    <rect x="25" y="130" width="80" height="4" rx="2" fill="#1e293b"/>
    <rect x="25" y="130" width="55" height="4" rx="2" fill="#38bdf8"/>
  </g>

  <!-- Right Automated Dispensing / Inventory Cabinet Symbol -->
  <g class="float-2" transform="translate(1010, 75)">
    <rect x="0" y="0" width="130" height="165" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#10b981" stroke-width="1.5" class="shimmer-card"/>
    <!-- Drawers / Shelves -->
    <rect x="18" y="22" width="94" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="65" cy="34" r="3" fill="#38bdf8"/>
    <rect x="18" y="54" width="94" height="24" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="65" cy="66" r="3" fill="#818cf8"/>
    <rect x="18" y="86" width="94" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="65" cy="98" r="3" fill="#34d399"/>
    
    <!-- RFID / Barcode Pulse Line -->
    <line x1="20" y1="125" x2="110" y2="125" stroke="#f59e0b" stroke-width="2" class="dashed-flow"/>
    <text x="65" y="147" fill="#94a3b8" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle" letter-spacing="1">RFID ACTIVE</text>
  </g>

  <!-- Central Header Content -->
  <g transform="translate(470, 38)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4" fill="#10b981" class="pulse-item"/>
    <text x="135" y="18" fill="#bae6fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="115" fill="url(#titleGrad)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="0.5" filter="url(#softGlow)">
    AWESOME PHARMACY INVENTORY MANAGEMENT
  </text>

  <!-- Subtitle -->
  <text x="600" y="152" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0.2">
    Enterprise SaaS &amp; Open-Source Systems for Medication Stock Control, Dispensing &amp; Healthcare Supply Chains
  </text>

  <!-- Core Capability Pills / Badges (Centered) -->
  <g transform="translate(230, 195)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="38" rx="10" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="80" y="24" fill="#e0f2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">🏥 Hospital &amp; Clinical</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(180, 0)">
      <rect width="180" height="38" rx="10" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="90" y="24" fill="#ede9fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">💊 Automated Dispensing</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(380, 0)">
      <rect width="180" height="38" rx="10" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
      <text x="90" y="24" fill="#d1fae5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">📦 Stock &amp; Expiry Control</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(580, 0)">
      <rect width="160" height="38" rx="10" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
      <text x="80" y="24" fill="#fef3c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔗 DSCSA &amp; Traceability</text>
    </g>
  </g>

  <!-- Modern Corner Tech Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 20 290 L 20 320 L 50 320" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 1180 290 L 1180 320 L 1150 320" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Footer Banner Accent Line -->
  <line x1="300" y1="300" x2="900" y2="300" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
